<svg xmlns="http://www.w3.org/2000/svg" width="170" height="44" viewBox="0 0 170 44" role="img" aria-label="LinkedIn">
<style>
text { font-family: JetBrains Mono, Cascadia Code, Consolas, ui-monospace, monospace; }
.shine { animation: shine 4s 0.35s ease-in-out infinite; }
@keyframes shine { 0% { transform: translateX(-80px); } 45%, 100% { transform: translateX(210px); } }
.dot { animation: blink 1.6s 0.35s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .typed { clip-path: none !important; } }
</style>
<defs>
  <clipPath id="c"><rect width="170" height="44" rx="10"/></clipPath>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="170" height="44" fill="#10141a"/>
  <rect class="shine" x="0" y="0" width="60" height="44" fill="url(#g)"/>
  <rect x="0" y="41" width="170" height="3" fill="#1fbf75"/>
</g>
<rect x="0.5" y="0.5" width="169" height="43" rx="10" fill="none" stroke="#222a33"/>
<circle class="dot" cx="20" cy="21" r="4" fill="#1fbf75"/>
<text x="34" y="26" font-size="14" font-weight="700" fill="#e4e7eb">LinkedIn</text>
<text x="154" y="26" text-anchor="end" font-size="14" fill="#8b95a3">↗</text>
</svg>