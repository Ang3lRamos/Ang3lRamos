<svg xmlns="http://www.w3.org/2000/svg" width="960" height="245" viewBox="0 0 960 245" role="img" aria-label="About: Systems Engineer and Automation &amp; BI Analyst at WTW who also does DevOps on AWS with Terraform, with experience in finance and insurance (Bancolombia, WTW). I find manual, repetitive processes and replace them with dashboards and automations that run on their own: Python, SQL, Power BI, C# (RPA) and Azure. I also ship full-stack web apps end to end: Next.js, React and TypeScript on the front, FastAPI, Node.js and Supabase/Postgres on the back, deployed on Vercel and AWS. Lately I build AI-powered systems with Claude: LLMs as decision components with validated structured output, evaluated with real statistics instead of vibes, and shipped end to end with Claude Code.">
