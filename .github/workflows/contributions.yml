# Redibuja assets/contributions.svg cada día con las contribuciones públicas del último año.
name: contributions

on:
  schedule:
    - cron: "17 5 * * *"   # 00:17 en Colombia
  workflow_dispatch:
  push:
    paths:
      - scripts/contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/contributions.py Ang3lRamos
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --cached --quiet || { git commit -m "Calendario de contribuciones actualizado"; git push; }
